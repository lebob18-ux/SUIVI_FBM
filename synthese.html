<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCLE-MMM · Synthèse Direction</title>
<style>
  :root {
    --navy: #0b2545; --jaune: #f2c200; --sx: #2f6f9f; --fb: #8a5fb0;
    --pose: #2f8f63; --ec: #e08a1e; --dep: #c4543b; --gc: #b7881a;
    --ad: #0e9aa7; --mu: #6b7884; --ln: #d9dee2; --sl: #eef1f3;
    --tx: #1a232c; --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 15px/1.45 system-ui, "Segoe UI", Roboto, sans-serif;
    background: var(--sl); color: var(--tx); padding: 24px 16px 48px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }

  .hero {
    background: var(--navy); color: #fff; border-radius: 12px;
    padding: 28px 32px 24px; position: relative; overflow: hidden; margin-bottom: 20px;
  }
  .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--jaune); }
  .hero h1 { font-size: 22px; letter-spacing: .3px; margin-bottom: 6px; }
  .hero p { opacity: .85; font-size: 14px; }
  .hero .meta { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; opacity: .75; }

  /* Navigation chantiers */
  .nav {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px;
  }
  .nav button {
    font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 10px;
    border: 1px solid var(--ln); background: var(--card); cursor: pointer; min-height: 42px;
  }
  .nav button.on {
    background: var(--navy); color: #fff; border-color: var(--navy);
  }
  .nav button.primary-action {
    background: var(--jaune); color: var(--navy); border-color: var(--jaune); margin-left: auto;
  }

  .kpis {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px;
  }
  @media (max-width: 720px) { .kpis { grid-template-columns: 1fr 1fr; } }
  .kpi {
    background: var(--card); border: 1px solid var(--ln); border-radius: 12px;
    padding: 16px 18px; border-top: 4px solid var(--sx);
  }
  .kpi.fb { border-top-color: var(--fb); }
  .kpi.gc { border-top-color: var(--gc); }
  .kpi.pose { border-top-color: var(--pose); }
  .kpi .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--mu); margin-bottom: 6px; }
  .kpi .val { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .kpi .sub { font-size: 12px; color: var(--mu); margin-top: 4px; }

  section { margin-bottom: 28px; }
  h2 {
    font-size: 15px; font-weight: 700; border-bottom: 2px solid var(--tx);
    padding-bottom: 6px; margin-bottom: 16px;
  }

  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 700px) { .split { grid-template-columns: 1fr; } }

  .col-card {
    background: var(--card); border: 1px solid var(--ln); border-radius: 14px; padding: 20px;
  }
  .col-card h3 {
    font-size: 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .col-card h3 .tag {
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; color: #fff;
  }
  .tag.reg { background: var(--sx); }
  .tag.anc { background: var(--ad); }

  .row-ind {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 8px 0; border-bottom: 1px solid var(--ln);
  }
  .row-ind:last-child { border-bottom: 0; }
  .row-ind .lab { font-size: 13px; color: var(--mu); }
  .row-ind .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .row-ind .sub { font-size: 12px; color: var(--mu); }
  .prog { height: 8px; background: var(--sl); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .prog i { display: block; height: 100%; border-radius: 4px; }

  .pies { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .pies { grid-template-columns: 1fr; } }
  .pie-card {
    background: var(--card); border: 1px solid var(--ln); border-radius: 14px;
    padding: 18px 14px; text-align: center;
  }
  .pie-card svg { display: block; margin: 0 auto 10px; }
  .pie-card .title { font-weight: 700; font-size: 13px; }
  .pie-card .pct { font-size: 20px; font-weight: 700; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .pie-card .detail { font-size: 12px; color: var(--mu); }

  .bigs { display: grid; gap: 12px; }
  .big {
    background: var(--card); border: 1px solid var(--ln); border-radius: 12px;
    padding: 16px 20px; display: flex; align-items: center; gap: 18px;
  }
  .big .bar { width: 6px; align-self: stretch; border-radius: 3px; flex-shrink: 0; }
  .big .content { flex: 1; min-width: 0; }
  .big .lab { font-size: 12px; color: var(--mu); text-transform: uppercase; letter-spacing: .04em; }
  .big .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .big .sub { font-size: 13px; color: var(--mu); margin-top: 2px; }
  .big .right { text-align: right; font-size: 13px; color: var(--mu); white-space: nowrap; }

  table {
    width: 100%; border-collapse: collapse; background: var(--card);
    border-radius: 12px; overflow: hidden; border: 1px solid var(--ln);
    font-variant-numeric: tabular-nums;
  }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--mu); padding: 12px; border-bottom: 1px solid var(--tx); background: #f8f9fa;
  }
  td { padding: 11px 12px; border-bottom: 1px solid var(--ln); font-size: 13px; }
  tr:last-child td { border-bottom: 0; }
  td.n { text-align: right; }
  td.ok { color: var(--pose); font-weight: 600; }
  td.bad { color: var(--dep); font-weight: 600; }

  .foot {
    margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--ln);
    font-size: 12px; color: var(--mu); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }

  @media print {
    @page { size: A4; margin: 11mm; }
    body { background: #fff; padding: 0; }
    .nav, .no-print { display: none !important; }
    .hero, .col-card, .big, tr, .pie-card { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <h1 id="hero-title">SUIVI PCLE-MMM · Synthèse Direction</h1>
    <p id="hero-sub">Avancement global — Supports classiques vs Supports Ancrage</p>
    <div class="meta">
      <span id="hero-meta">THOMERY · CEPOY · SAMOIS · BOIS LE ROI</span>
      <span>Export 24/11/2026</span>
      <span>TEST_BOB exclu</span>
    </div>
  </header>

  <nav class="nav no-print">
    <button type="button" data-ch="ALL" class="on">Tous les chantiers</button>
    <button type="button" data-ch="THOMERY">THOMERY</button>
    <button type="button" data-ch="CEPOY">CEPOY</button>
    <button type="button" data-ch="SAMOIS">SAMOIS</button>
    <button type="button" data-ch="BOIS LE ROI">BOIS LE ROI</button>
    <button type="button" class="primary-action" onclick="window.print()">📄 PDF de cette vue</button>
  </nav>

  <div id="content"></div>

  <div class="foot">
    <span>Document généré pour SUIVI PCLE-MMM — version direction</span>
    <span>Supports Anc = n° contenant « Anc » · TEST_BOB exclu</span>
  </div>
</div>

<script>
const DATA = {
  "ALL": {
    title: "Synthèse Direction — Tous les chantiers",
    sub: "Avancement global — Supports classiques vs Supports Ancrage",
    meta: "THOMERY · CEPOY · SAMOIS · BOIS LE ROI",
    kpi: [
      ["Fouilles (tous)", "66 %", "90 / 137", ""],
      ["Matages (tous)", "90", "supports matés", "fb"],
      ["Béton coulé", "349 m³", "219 + 130 (Anc)", "gc"],
      ["Consoles de ligne", "11 %", "17 / 156 (classiques)", "pose"]
    ],
    class: { fouille: [53,90], matage: [53,90], beton: "219,1", prevu: "303,1", console: [17,156], armement: [0,168], double: [0,16], connexion: [0,143] },
    anc:   { fouille: [37,47], matage: [37,47], beton: "129,8", prevu: "155,1" },
    showTable: true,
    table: [
      ["THOMERY", "terminé", "terminé", "45", "144,4 m³", "6 / 45", true],
      ["CEPOY", "terminé", "terminé", "39", "161,6 m³", "11 / 22", true],
      ["SAMOIS", "terminé", "terminé", "6", "43,0 m³", "0 / 7", true],
      ["BOIS LE ROI", "0 / 37", "0 / 10", "0", "—", "0 / 82", false]
    ],
    attn: [
      ["BOIS LE ROI", "Aucune fouille / matage démarré", "47 supports GC encore à 0 %", "dep"],
      ["Pose des consoles de ligne", "Seulement 11 % réalisées", "17 sur 156 — uniquement supports classiques", "ec"],
      ["Armements & Connexions", "0 réalisé", "0/168 armements · 0/16 doubles · 0/143 connexions", "dep"],
      ["Poutres", "0 posée sur 13", "Aucune tâche « POUTRE » terminée", "mu"]
    ]
  },
  "THOMERY": {
    title: "Synthèse Direction — THOMERY",
    sub: "Détail du chantier THOMERY",
    meta: "Chantier THOMERY",
    kpi: [
      ["Fouilles", "100 %", "45 / 45", ""],
      ["Matages", "45", "tous terminés", "fb"],
      ["Béton coulé", "144 m³", "79,8 + 64,6 (Anc)", "gc"],
      ["Consoles", "13 %", "6 / 45", "pose"]
    ],
    class: { fouille: [27,27], matage: [27,27], beton: "79,8", prevu: "—", console: [6,45], armement: [0,53], double: [0,6], connexion: [0,30] },
    anc:   { fouille: [18,18], matage: [18,18], beton: "64,6", prevu: "—" },
    showTable: false,
    attn: [
      ["GC terminé", "Fouilles & matages 100 %", "Supports classiques et Ancrage terminés", "pose"],
      ["Pose en retard", "Consoles 6/45 · Armements 0 · Connexions 0", "La phase pose n’a quasiment pas démarré", "ec"]
    ]
  },
  "CEPOY": {
    title: "Synthèse Direction — CEPOY",
    sub: "Détail du chantier CEPOY",
    meta: "Chantier CEPOY",
    kpi: [
      ["Fouilles", "100 %", "39 / 39", ""],
      ["Matages", "39", "tous terminés", "fb"],
      ["Béton coulé", "162 m³", "108,6 + 53,0 (Anc)", "gc"],
      ["Consoles", "50 %", "11 / 22", "pose"]
    ],
    class: { fouille: [22,22], matage: [22,22], beton: "108,6", prevu: "—", console: [11,22], armement: [0,25], double: [0,3], connexion: [0,59] },
    anc:   { fouille: [17,17], matage: [17,17], beton: "53,0", prevu: "—" },
    showTable: false,
    attn: [
      ["GC terminé", "Fouilles & matages 100 %", "Meilleur avancement pose (consoles 50 %)", "pose"],
      ["Armements & Connexions", "Toujours à 0", "0/25 armements · 0/59 connexions", "ec"]
    ]
  },
  "SAMOIS": {
    title: "Synthèse Direction — SAMOIS",
    sub: "Détail du chantier SAMOIS",
    meta: "Chantier SAMOIS",
    kpi: [
      ["Fouilles", "100 %", "6 / 6", ""],
      ["Matages", "6", "tous terminés", "fb"],
      ["Béton coulé", "43 m³", "30,8 + 12,2 (Anc)", "gc"],
      ["Consoles", "0 %", "0 / 7", "pose"]
    ],
    class: { fouille: [4,4], matage: [4,4], beton: "30,8", prevu: "—", console: [0,7], armement: [0,9], double: [0,3], connexion: [0,8] },
    anc:   { fouille: [2,2], matage: [2,2], beton: "12,2", prevu: "—" },
    showTable: false,
    attn: [
      ["GC terminé", "Fouilles & matages 100 %", "Petit chantier, GC achevé", "pose"],
      ["Pose non démarrée", "0 console · 0 armement · 0 connexion", "Toute la phase pose reste à faire", "dep"]
    ]
  },
  "BOIS LE ROI": {
    title: "Synthèse Direction — BOIS LE ROI",
    sub: "Détail du chantier BOIS LE ROI",
    meta: "Chantier BOIS LE ROI",
    kpi: [
      ["Fouilles", "0 %", "0 / 47", ""],
      ["Matages", "0", "aucun", "fb"],
      ["Béton coulé", "—", "non démarré", "gc"],
      ["Consoles", "0 %", "0 / 82", "pose"]
    ],
    class: { fouille: [0,37], matage: [0,37], beton: "0", prevu: "—", console: [0,82], armement: [0,81], double: [0,4], connexion: [0,46] },
    anc:   { fouille: [0,10], matage: [0,10], beton: "0", prevu: "—" },
    showTable: false,
    attn: [
      ["Chantier non démarré", "Aucune fouille / matage", "37 supports classiques + 10 Anc à 0 %", "dep"],
      ["Pose", "0 sur tout", "82 consoles · 81 armements · 46 connexions en attente", "mu"]
    ]
  }
};

function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
function pie(done, total, color, label) {
  const p = pct(done, total);
  const circ = 2 * Math.PI * 50;
  const dash = (p / 100) * circ;
  return `<div class="pie-card">
    <svg width="130" height="130" viewBox="0 0 130 130">
      <circle cx="65" cy="65" r="50" fill="none" stroke="#eef1f3" stroke-width="16"/>
      <circle cx="65" cy="65" r="50" fill="none" stroke="${color}" stroke-width="16"
        stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 65 65)"/>
      <text x="65" y="62" text-anchor="middle" font-size="20" font-weight="700" fill="#1a232c">${p}%</text>
      <text x="65" y="78" text-anchor="middle" font-size="10" fill="#6b7884">${label}</text>
    </svg>
    <div class="title">${label}</div>
    <div class="pct" style="color:${color}">${done} / ${total}</div>
  </div>`;
}

function render(key) {
  const D = DATA[key];
  document.getElementById("hero-title").textContent = D.title;
  document.getElementById("hero-sub").textContent = D.sub;
  document.getElementById("hero-meta").textContent = D.meta;
  document.querySelectorAll(".nav button[data-ch]").forEach(b => b.classList.toggle("on", b.dataset.ch === key));

  const c = D.class, a = D.anc;
  let html = "";

  // KPIs
  html += `<div class="kpis">`;
  D.kpi.forEach(([lab, val, sub, cls]) => {
    html += `<div class="kpi ${cls||""}"><div class="lab">${lab}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`;
  });
  html += `</div>`;

  // Split class / anc
  html += `<section><h2>Supports classiques / Supports Ancrage</h2><div class="split">`;
  html += `<div class="col-card"><h3>Supports classiques <span class="tag reg">hors Anc</span></h3>
    <div class="row-ind"><div><div class="lab">Fouilles</div><div class="prog"><i style="width:${pct(c.fouille[0],c.fouille[1])}%;background:var(--gc)"></i></div></div><div class="val">${c.fouille[0]} <span class="sub">/ ${c.fouille[1]}</span></div></div>
    <div class="row-ind"><div><div class="lab">Matages</div><div class="prog"><i style="width:${pct(c.matage[0],c.matage[1])}%;background:var(--fb)"></i></div></div><div class="val">${c.matage[0]} <span class="sub">/ ${c.matage[1]}</span></div></div>
    <div class="row-ind"><div><div class="lab">Béton coulé</div></div><div class="val">${c.beton} m³</div></div>
    <div class="row-ind"><div><div class="lab">Consoles de ligne</div><div class="prog"><i style="width:${pct(c.console[0],c.console[1])}%;background:var(--pose)"></i></div></div><div class="val">${c.console[0]} <span class="sub">/ ${c.console[1]}</span></div></div>
    <div class="row-ind"><div><div class="lab">Armements</div><div class="prog"><i style="width:${pct(c.armement[0],c.armement[1])}%;background:var(--pose)"></i></div></div><div class="val">${c.armement[0]} <span class="sub">/ ${c.armement[1]}</span></div></div>
    <div class="row-ind"><div><div class="lab">Armements doubles</div><div class="prog"><i style="width:${pct(c.double[0],c.double[1])}%;background:var(--pose)"></i></div></div><div class="val">${c.double[0]} <span class="sub">/ ${c.double[1]}</span></div></div>
    <div class="row-ind"><div><div class="lab">Connexions</div><div class="prog"><i style="width:${pct(c.connexion[0],c.connexion[1])}%;background:var(--sx)"></i></div></div><div class="val">${c.connexion[0]} <span class="sub">/ ${c.connexion[1]}</span></div></div>
  </div>`;
  html += `<div class="col-card"><h3>Supports Ancrage <span class="tag anc">contient Anc</span></h3>
    <div class="row-ind"><div><div class="lab">Fouilles</div><div class="prog"><i style="width:${pct(a.fouille[0],a.fouille[1])}%;background:var(--gc)"></i></div></div><div class="val">${a.fouille[0]} <span class="sub">/ ${a.fouille[1]}</span></div></div>
    <div class="row-ind"><div><div class="lab">Matages</div><div class="prog"><i style="width:${pct(a.matage[0],a.matage[1])}%;background:var(--fb)"></i></div></div><div class="val">${a.matage[0]} <span class="sub">/ ${a.matage[1]}</span></div></div>
    <div class="row-ind"><div><div class="lab">Béton coulé</div></div><div class="val">${a.beton} m³</div></div>
    <div class="row-ind"><div><div class="lab">Consoles / Armements / Connexions</div></div><div class="val" style="font-size:14px">— <span class="sub">non concernées</span></div></div>
  </div></div></section>`;

  // Pies
  html += `<section><h2>Avancement visuel</h2><div class="pies">
    ${pie(c.fouille[0], c.fouille[1], "#2f6f9f", "Classiques")}
    ${pie(a.fouille[0], a.fouille[1], "#0e9aa7", "Ancrages")}
    ${pie(c.console[0], c.console[1], "#2f8f63", "Consoles")}
  </div></section>`;

  // Pose section
  html += `<section><h2>Pose — Armements & Connexions</h2><div class="bigs">
    <div class="big"><div class="bar" style="background:var(--pose)"></div><div class="content"><div class="lab">Armements</div><div class="val">${c.armement[0]} / ${c.armement[1]}</div><div class="sub">tâches « ARMEMENT »</div></div><div class="right">${pct(c.armement[0],c.armement[1])} %</div></div>
    <div class="big"><div class="bar" style="background:var(--pose)"></div><div class="content"><div class="lab">Armements doubles</div><div class="val">${c.double[0]} / ${c.double[1]}</div><div class="sub">tâches « ARMEMENT DOUBLE »</div></div><div class="right">${pct(c.double[0],c.double[1])} %</div></div>
    <div class="big"><div class="bar" style="background:var(--sx)"></div><div class="content"><div class="lab">Connexions</div><div class="val">${c.connexion[0]} / ${c.connexion[1]}</div><div class="sub">tâches « CONNEXION »</div></div><div class="right">${pct(c.connexion[0],c.connexion[1])} %</div></div>
    <div class="big"><div class="bar" style="background:var(--pose)"></div><div class="content"><div class="lab">Consoles de ligne</div><div class="val">${c.console[0]} / ${c.console[1]}</div><div class="sub">tâches contenant « CONSOLE DE LIGNE »</div></div><div class="right">${pct(c.console[0],c.console[1])} %</div></div>
  </div></section>`;

  // Table globale only
  if (D.showTable) {
    html += `<section><h2>Synthèse par chantier</h2><table>
      <thead><tr><th>Chantier</th><th class="n">Fouilles class.</th><th class="n">Fouilles Anc</th><th class="n">Matages</th><th class="n">Béton</th><th class="n">Consoles</th></tr></thead>
      <tbody>`;
    D.table.forEach(([n, fc, fa, m, b, c, ok]) => {
      html += `<tr><td><strong>${n}</strong></td>
        <td class="n ${ok?"ok":"bad"}">${fc}</td>
        <td class="n ${ok?"ok":"bad"}">${fa}</td>
        <td class="n ${ok?"ok":"bad"}">${m}</td>
        <td class="n">${b}</td>
        <td class="n">${c}</td></tr>`;
    });
    html += `</tbody></table></section>`;
  }

  // Attention
  html += `<section><h2>Points d’attention</h2><div class="bigs">`;
  D.attn.forEach(([lab, val, sub, col]) => {
    html += `<div class="big"><div class="bar" style="background:var(--${col})"></div>
      <div class="content"><div class="lab">${lab}</div><div class="val" style="font-size:17px">${val}</div><div class="sub">${sub}</div></div></div>`;
  });
  html += `</div></section>`;

  document.getElementById("content").innerHTML = html;
}

document.querySelectorAll(".nav button[data-ch]").forEach(b => {
  b.addEventListener("click", () => render(b.dataset.ch));
});
render("ALL");
</script>
</body>
</html>
