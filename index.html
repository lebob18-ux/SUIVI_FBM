<style>
:root{--bg:#eef1f3;--card:#fff;--tx:#1a232c;--mu:#6b7884;--ln:#d9dee2;--sl:#dde2e6;--gc:#b7881a;--dep:#c4543b;--pose:#2f8f63;--sx:#2f6f9f;--fb:#8a5fb0;--ec:#e08a1e;--ad:#0e9aa7}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;padding:0 0 env(safe-area-inset-bottom,0px)}
main{max-width:760px;margin:0 auto;padding:0 12px 24px}

#st{font-size:12px;color:var(--mu)}
select{font:inherit;color:var(--tx);border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:8px 12px;min-height:44px;width:100%;font-weight:600}
button,input{font:inherit;color:var(--tx);border:1px solid var(--ln);background:var(--card);border-radius:8px;padding:8px 12px;min-height:42px}
nav{display:flex;gap:6px}

.seg{display:flex;gap:4px;background:var(--sl);padding:3px;border-radius:10px;margin:12px 0}

.seg button[aria-pressed=true]{background:var(--card);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=search]{width:100%;margin:12px 0 4px}
.tg{display:flex;align-items:center;gap:8px;min-height:42px}
.tg input{width:20px;height:20px;min-height:0;margin:0}
.lg{font-size:12px;color:var(--mu);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}

.rings{display:flex;justify-content:space-around;gap:10px}

.row{margin:12px 0}
.rl{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px}
.rl b{font-variant-numeric:tabular-nums}
.bar,.sb{height:12px;border-radius:6px;background:var(--sl);overflow:hidden;display:flex}
.big{height:20px;border-radius:10px}
.bar i,.sb i{display:block;height:100%}
.bar i{background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.22) 6px 8px)}
.lg2{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mu);margin-bottom:6px}
.lg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.lg2 i.o{background:var(--sl)}
.chart{display:flex;align-items:flex-end;gap:3px;height:110px;border-bottom:1px solid var(--ln)}
.col{flex:1;display:flex;flex-direction:column;height:100%;align-items:center;font-size:10px;color:var(--mu)}
.stk{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end}

.chips em{font-style:normal;font-size:11px;min-width:22px;display:inline-block;text-align:center;border:1px solid var(--fb);border-radius:4px;margin-left:3px;padding:1px 4px;color:var(--mu)}
.chips em.on{background:var(--fb);color:#fff}

.tl{font-size:12px;margin-top:5px}

dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{position:sticky;top:0;background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--ln)}
.db{padding:14px}
.tb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tb th,.tb td{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:right}
.tb th:first-child,.tb td:first-child{text-align:left;color:var(--mu)}
.df{color:var(--gc);font-weight:600}
.th{font-weight:600;margin:12px 0 2px;font-size:14px}
.tk{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}
.ck{flex:none;width:22px;height:22px;border:2px solid var(--ln);border-radius:5px;display:grid;place-items:center;font-size:14px;color:#fff}
.ck.on{background:var(--pose);border-color:var(--pose)}
.ck.admin{background:var(--ad);border-color:var(--ad)}
.ck.ec{background:var(--ec);border-color:var(--ec)}
.ck.an{background:var(--mu);border-color:var(--mu)}
.fl{cursor:pointer;border-radius:8px;padding:4px 6px;margin:8px 0}
.fl.on{background:var(--sl)}
.fl small{color:var(--fb);font-weight:700}
.ss{padding:8px 4px;min-height:36px;cursor:pointer;border-radius:6px}
.ss:active{background:var(--sl)}
.admsearch{display:grid;gap:7px;margin-bottom:12px}.admsearch input{width:100%;min-width:0}.meta{font-size:12px;color:var(--mu);margin-top:4px}.tag{display:inline-block;border:1px solid var(--ln);border-radius:6px;padding:2px 6px;font-size:11px;margin:2px 3px 2px 0}
  #rapport{display:none}
@media print{
  @page{size:A4;margin:11mm 11mm 13mm}
  html,body{background:#fff!important;color:#1a232c!important;padding:0!important}
  body>*:not(#rapport){display:none!important}
  #rapport{display:block;font:10pt/1.35 system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#1a232c;--sx:#2f6f9f;--fb:#8a5fb0;--ad:#0e9aa7;--pose:#2f8f63;--ec:#e08a1e;--dep:#c4543b;--gc:#b7881a;--mu:#6b7884;--ln:#d9dee2;--sl:#e3e7ea;--tx:#1a232c;--card:#fff}
  #rapport *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rh{background:#0b2545;color:#fff;padding:14px 16px;border-radius:6px;border-bottom:4px solid #f2c200;margin-bottom:12px}
  .rh h1{font-size:17pt;margin:0}
  .rh p{margin:3px 0 0;font-size:10pt;opacity:.85}
  .rks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
  .rk{border:1px solid var(--ln);border-radius:6px;padding:8px 10px;break-inside:avoid}
  .rk span{display:block;font-size:8pt;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
  .rk b{display:block;font-size:20pt;line-height:1.15}
  .rk small{display:block;font-size:8pt;color:var(--mu)}
  .rs{margin:16px 0 6px;font-size:12pt;font-weight:700;border-bottom:2px solid var(--tx);padding-bottom:3px;break-after:avoid}
  .rt{width:100%;border-collapse:collapse;font-size:9.5pt}
  .rt th{text-align:left;font-size:8pt;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--tx);padding:4px}
  .rt td{padding:5px 4px;border-bottom:1px solid var(--ln);vertical-align:middle}
  .rt tr{break-inside:avoid}
  .rt thead{display:table-header-group}
  .rt .n{text-align:right;white-space:nowrap}
  .rt small{display:block;font-size:8pt;color:var(--mu);margin-top:2px}
  #rapport .row{break-inside:avoid}
  #rapport .bar i{background-image:none}
  .rf{margin-top:18px;padding-top:6px;border-top:1px solid var(--ln);font-size:8pt;color:var(--mu)}
}
</style>

<body>
<main>
<div class="top">
<header><div><h1>SUIVI_PCLE-MMM</h1><div id="st"></div></div><span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button id="adm" type="button" style="font-weight:600">🔐 Admin</button><button id="inst" type="button" style="display:none;font-weight:600">📲 Installer</button><button id="pdf" type="button" style="font-weight:600">📄 PDF</button><button id="rf" type="button">Actualiser</button></span></header>
<nav><button type="button" data-t="syn" aria-pressed="true">Synthèse</button><button type="button" data-t="ch" aria-pressed="false">Chantiers</button><button type="button" data-t="qa" aria-pressed="false" id="nqa">Qualité</button><button type="button" data-t="adm" aria-pressed="false" id="nadm" style="display:none">Admin</button></nav>
</div>
<div id="v"></div>
</main>
<dialog id="dlg"></dialog>
  <div id="rapport"></div>
<script>
const SUPABASE_URL = "https://thbqkeugjvsxbryfnzuo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_2-Ij-nrTPeK6rB-kSD-QTg_b42zNakq";

const TYPES = ['GC','DEPOSE','POSE'];
const TC = {GC:'--gc',DEPOSE:'--dep',POSE:'--pose','RELEVER CAT':'--sx'};
const TL = {GC:'Génie civil',DEPOSE:'Dépose',POSE:'Pose','RELEVER CAT':'Relevés CAT'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key = s => String(s || '').trim().toUpperCase();
const pc = (v,t) => t ? Math.round(v/t*100) : 0;
const nf = n => (Math.round(n*10)/10).toLocaleString('fr-FR');
let D = null, tab = 'syn', sub = 'glob', qf = 'nc', sel = 'all', last = 0;
let sutxType = 'all';
let ADM = null, vp = 'all', admQ = '', supOuvert = null, cf = {}, OPEN = new Set();

async function fetchAll(table, cols){
  let out = [], from = 0; const step = 1000;
  for(;;){
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=${cols}&order=id.asc`, {
      headers:{apikey:SUPABASE_ANON_KEY, 'Range-Unit':'items', Range:`${from}-${from+step-1}`}
    });
    if(!r.ok) throw new Error(`${table} : erreur ${r.status}`);
    const a = await r.json();
    out = out.concat(a);
    if(a.length < step) break;
    from += step;
  }
  return out;
}

/* ---------- Calculs : T terminé, E en cours, A annulé, F à faire ---------- */
const eff = r => r.Fait ? 'T' : r.admin_etat === 'TERMINE' ? 'T' : r.etat === 'EN_COURS' ? 'E' : r.etat === 'ANNULE' ? 'A' : r.admin_etat === 'EN_COURS' ? 'E' : r.admin_etat === 'ANNULE' ? 'A' : 'F';
const viaAdmin = r => !r.Fait && (r.admin_etat === 'TERMINE' || (!!r.admin_etat && r.etat !== 'EN_COURS' && r.etat !== 'ANNULE'));
const pctOf = r => r.etat === 'EN_COURS' ? (+r.pct_avancement || 0) : (+r.admin_pct || 0);
const isFBM = r => key(r.type) === 'GC' && /fouille|beton|matage/.test(String(r.Tache || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase());
const ncOf = rows => rows.filter(r => r.conforme === false && r.nc_levee !== true).length;

/* ---------- FKT : tâches « RELEVER CAT », seules les définitives comptent ---------- */
const isRC = r => key(r.type) === 'RELEVER CAT';
/* FKT : portée par les tâches de relevé (hauteur, désaxement, R1-R2...), pas par les lignes « FKT ... » */
const isFKT = r => isRC(r) && !/^fkt/.test(String(r.Tache || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim());
function adminFktOf(r){ try{ return r.admin_fkt ? JSON.parse(r.admin_fkt) : null; }catch(e){ return null; } }
/* s : 'T' terrain, 'A' saisi par moi · def : définitive · prov : provisoire seulement */
function fktOf(r){
  const f = key(r.fkt_etat), a = adminFktOf(r);
  if(f === 'DEFINITIVE') return {s:'T', def:true, prov:false, num:r.fkt_num || ''};
  if(a && a.etat === 'DEFINITIVE') return {s:'A', def:true, prov:false, num:a.num || ''};
  if(f === 'PROVISOIRE') return {s:'T', def:false, prov:true, num:r.fkt_num || ''};
  return {s:null, def:false, prov:false, num:''};
}
function aggK(rows){
  const o = {n:0, T:0, A:0, P:0, none:0};
  rows.filter(r => isFKT(r) && eff(r) !== 'A').forEach(r => { const k = fktOf(r); o.n++; if(k.def){ if(k.s === 'T') o.T++; else o.A++; } else if(k.prov) o.P++; else o.none++; });
  o.d = o.T + o.A; o.p = o.n ? Math.round(o.d / o.n * 100) : 0;
  return o;
}
function fktChip(r){
  const k = fktOf(r);
  if(k.def) return `<div class="nc" style="background:${k.s === 'A' ? 'rgba(14,154,167,.15)' : 'rgba(183,136,26,.15)'};color:var(${k.s === 'A' ? '--ad' : '--gc'})">📄 FKT définitive${k.num ? ' n° ' + esc(k.num) : ''}${k.s === 'A' ? ' · saisie par moi 📌' : ' · terrain'}</div>`;
  if(k.prov) return `<div class="nc" style="background:rgba(107,120,132,.15);color:var(--mu)">📄 FKT provisoire${k.num ? ' n° ' + esc(k.num) : ''} · définitive à obtenir</div>`;
  const d = r.date_fait || r.admin_le, late = eff(r) === 'T' && d && (Date.now() - new Date(String(d).slice(0,10) + 'T00:00:00')) > 4 * 86400000;
  return `<div class="nc"${late ? '' : ' style="background:rgba(107,120,132,.15);color:var(--mu)"'}>📄 Pas de FKT${late ? ' · délai de 4 jours dépassé' : ''}</div>`;
}
function fktBlock(r){
  const k = fktOf(r);
  let h = fktChip(r);
  if(ADM && !(k.def && k.s === 'T')){
    const on = k.def && k.s === 'A';
    h += `<label class="tg" style="margin-top:2px"><input type="checkbox" data-adm="k" data-id="${r.id}"${on ? ' checked' : ''}> 📌 FKT définitive reçue</label>`;
    if(on) h += `<input type="text" data-adm="kn" data-id="${r.id}" value="${esc(k.num)}" placeholder="N° de FKT" style="min-height:36px;padding:4px 8px;width:100%">`;
  }
  return h;
}

function agg(rows){
  const o = {n:rows.length, T:0, E:0, A:0, F:0, nc:0, v:0, w:0, adm:0, Ta:0};
  rows.forEach(r => {
    const e = eff(r); o[e]++; if(viaAdmin(r)) o.adm++; if(e === 'T' && viaAdmin(r)) o.Ta++;
    if(r.conforme === false && r.nc_levee !== true) o.nc++;
    if(e !== 'A'){ o.w++; o.v += e === 'T' ? 1 : e === 'E' ? pctOf(r) / 100 : 0; }
  });
  o.p = o.w ? Math.round(o.v / o.w * 100) : 0;
  o.pA = o.w ? Math.min(o.p, Math.round(o.Ta / o.w * 100)) : 0;
  return o;
}

const STEPK = ['fouille','beton','matage'];
const stepsOf = p => p.b ? STEPK : STEPK.filter(k => p.fb.some(r => nz(r.Tache).includes(k)));
/* 'T' = relevé terrain, 'A' = saisi par l'admin, null = pas fait */
function stepState(p, k){
  const b = p.b, tk = p.fb.filter(r => nz(r.Tache).includes(k));
  if((b && b['date_' + k]) || tk.some(r => r.Fait)) return 'T';
  if((b && b['admin_date_' + k]) || tk.some(r => r.admin_etat === 'TERMINE')) return 'A';
  return null;
}
const fbmSups = c => Object.values(c.s).filter(p => p.b || p.fb.length);
  const num = v => { if(v === null || v === undefined || v === '') return null; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const m3r = b => b ? (num(b.m3_reel) ?? num(b.admin_m3_reel)) : null;   // réel : terrain d'abord, sinon valeur saisie par l'admin
function aggF(ps){
  const o = {n:ps.length, tot:ps.length, mp:0, mr:0, mpr:0, ec:0, sr:0, d:0, dT:0, dA:0, pE:0, s:{fouille:{T:0,A:0,n:0}, beton:{T:0,A:0,n:0}, matage:{T:0,A:0,n:0}}};
  ps.forEach(p => {
    if(p.b){
      const pv = num(p.b.m3_prevu) || 0, rl = m3r(p.b);
      o.mp += pv; o.mr += rl || 0;
      if(stepState(p, 'beton')){ o.mpr += pv; if(rl !== null) o.ec += rl - pv; else o.sr++; }
    }
    const st = stepsOf(p), E = st.map(k => stepState(p, k));
    st.forEach((k, i) => { const x = o.s[k]; x.n++; if(E[i] === 'T') x.T++; else if(E[i] === 'A') x.A++; });
    if(st.length && E.every(Boolean)){ if(E.every(s => s === 'T')) o.dT++; else o.dA++; }
    else if(E.some(Boolean)) o.pE++;
  });
  o.d = o.dT + o.dA;
  o.p = o.tot ? Math.round(o.d / o.tot * 100) : 0;
  o.pA = o.tot ? Math.min(o.p, Math.round(o.dA / o.tot * 100)) : 0;
  return o;
}
const EXCLUS = ['TEST_BOB'];   // chantiers de test : ignorés partout
function stats(sx, bl){
  sx = sx.filter(r => !EXCLUS.includes(key(r.Chantier)));
  bl = bl.filter(r => !EXCLUS.includes(key(r.chantier)));
    sx.forEach(r => { const t = key(r.type); if(t === 'POSE_SUPPORT' || t === 'POSE_ANC') r.type = 'POSE'; });
  
  const ch = {}, act = {}, qa = sx.filter(r => TYPES.includes(key(r.type)) || isRC(r));
  const get = n => ch[key(n)] || (ch[key(n)] = {k:key(n), name:String(n || '—').trim(), rows:[], fb:[], rc:[], bl:[], s:{}});
  const sp = (c,n) => c.s[key(n)] || (c.s[key(n)] = {k:key(n), name:String(n || '—').trim(), rows:[], fb:[], rc:[], b:null});
  const add = (d,i) => { if(!d) return; (act[d] = act[d] || [0,0])[i]++; };
  qa.forEach(r => {
    const c = get(r.Chantier), p = sp(c, r.Support);
    if(isRC(r)){ c.rc.push(r); p.rc.push(r); }
    else if(isFBM(r)){ c.fb.push(r); p.fb.push(r); }
    else { c.rows.push(r); p.rows.push(r); if(r.Fait) add(r.date_fait, 0); }
  });
  bl.forEach(r => { const c = get(r.chantier); c.bl.push(r); sp(c, r.support).b = r; add(r.date_fouille,1); add(r.date_beton,1); add(r.date_matage,1); });
  return {ch:Object.values(ch).sort((a,b) => a.name.localeCompare(b.name,'fr')), act, all:qa.filter(r => !isRC(r) && !isFBM(r)), qa, fb:qa.filter(isFBM), rc:qa.filter(isRC), bl};
}

/* ---------- Composants visuels ---------- */
const pbar = (p,c,h='') => `<div class="bar ${h}"><i style="width:${Math.min(100,p)}%;background-color:var(${c})"></i></div>`;
const row = (l,v,t,c,h='') => `<div class="row"><div class="rl"><span>${l}</span><b>${v} / ${t} · ${pc(v,t)} %</b></div>${pbar(pc(v,t),c,h)}</div>`;
const stk = a => { const n = a.n || 1, s = (v,c) => v ? `<i style="width:${v/n*100}%;background:var(${c})"></i>` : ''; return `<div class="sb">${s(a.T - (a.Ta || 0),'--pose')}${s(a.Ta || 0,'--ad')}${s(a.E,'--ec')}${s(a.A,'--mu')}</div>`; };
const dbar = (t,a,n,h='',c='--fb') => `<div class="bar ${h}"><i style="width:${n ? t/n*100 : 0}%;background-color:var(${c})"></i><i style="width:${n ? a/n*100 : 0}%;background-color:var(--ad)"></i></div>`;
const rowF = (l,x) => `<div class="row"><div class="rl"><span>${l}</span><b>${x.T + x.A} / ${x.n} · ${pc(x.T + x.A, x.n)} %</b></div>${dbar(x.T, x.A, x.n)}<div class="mu tl">${x.T} relevé(s) terrain · ${x.A} saisi(s) par moi</div></div>`;
const legend = () => `<div class="lg2"><span><i style="background:var(--pose)"></i>Terminé (terrain)</span><span><i style="background:var(--ad)"></i>Terminé par moi</span><span><i style="background:var(--ec)"></i>En cours</span><span><i style="background:var(--mu)"></i>Annulé</span><span><i class="o"></i>À faire</span></div>`;
const sg = (at, opts, cur) => `<div class="seg">${opts.map(([k,l]) => `<button type="button" data-${at}="${k}" aria-pressed="${k === cur}">${l}</button>`).join('')}</div>`;
const kpi = (l,v,s,c) => `<div class="kpi" style="border-left:4px solid var(${c})"><span class="mu">${l}</span><b>${v}</b><span class="mu tl" style="margin:0">${s}</span></div>`;
const ring = (p,c,l,pa=0) => `<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--sl)" stroke-width="12"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(${c})" stroke-width="12" stroke-dasharray="${(p-pa)*2.513} 251.3" transform="rotate(-90 50 50)"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--ad)" stroke-width="12" stroke-dasharray="${pa*2.513} 251.3" stroke-dashoffset="${-(p-pa)*2.513}" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" font-size="22" font-weight="700" fill="var(--tx)">${p}%</text></svg>${l}</div>`;

function vAct(act){
  const days = []; let tx = 0, tf = 0;
  for(let i = 13; i >= 0; i--){
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const a = act[k] || [0,0];
    tx += a[0]; tf += a[1];
    days.push([d.getDate(), a[0], a[1]]);
  }
  const m = Math.max(1, ...days.map(d => d[1] + d[2]));
  const cols = days.map(d => `<div class="col"><div class="stk"><span style="height:${d[2]/m*100}%;background:var(--fb)"></span><span style="height:${d[1]/m*100}%;background:var(--sx)"></span></div>${d[0]}</div>`).join('');
  return `<div class="card"><h2>Activité des 14 derniers jours</h2><div class="chart">${cols}</div>
  <div class="mu tl"><span style="color:var(--sx)">■</span> ${tx} tâches SUTX terminées &nbsp; <span style="color:var(--fb)">■</span> ${tf} étapes FBM</div></div>`;
}

/* ---------- Onglet Synthèse (sous-menus + choix du chantier) ---------- */
function scope(){
  const c = sel === 'all' ? null : D.ch.find(x => x.k === sel);
  if(!c) sel = 'all';
  return c ? {c, rows:c.rows, bl:c.bl, fb:c.fb, rc:c.rc, ps:fbmSups(c)} : {c:null, rows:D.all, bl:D.bl, fb:D.fb, rc:D.rc, ps:D.ch.flatMap(fbmSups)};
}

function actOf(rows, ps){
  const a = {}, add = (d,i) => { if(!d) return; const k = String(d).slice(0,10); (a[k] = a[k] || [0,0])[i]++; };
  rows.forEach(r => { if(r.Fait) add(r.date_fait, 0); else if(r.admin_etat === 'TERMINE') add(r.admin_le, 0); });
  ps.forEach(p => STEPK.forEach(k => {
    let d = p.b && (p.b['date_' + k] || p.b['admin_date_' + k]);
    if(!d){ const r = p.fb.find(r => nz(r.Tache).includes(k) && (r.Fait || r.admin_etat === 'TERMINE')); if(r) d = r.Fait ? r.date_fait : r.admin_le; }
    add(d, 1);
  }));
  return a;
}

function vSyn(){
  const S = scope(), a = agg(S.rows), f = aggF(S.ps);
  const pick = S.c ? `<button type="button" data-pick="all" style="width:100%;font-weight:600;margin:4px 0 0">← Tous les chantiers · ${esc(S.c.name)}</button>` : '';
  const s = pick + sg('sub', [['glob','Vue d\'ensemble'],['sutx','SUTX'],['fbm','FBM']], sub);

  const L = S.c
    ? (sub === 'sutx' ? supListSutx(S.c, sutxType) : supList(S.c))
    : null;
  const nok = L ? L.filter(x => x.ok).length : 0;
  const sup = L
    ? `<div class="card">
        <h2>Supports · ${nok} / ${L.length} terminés</h2>
        ${L.map(x => sub === 'sutx' ? sRowSutx(x, S.c.k) : sRow(x, S.c.k)).join('') || '<div class="mu">Aucun support.</div>'}
      </div>`
    : '';

  const parC = `<div class="card"><h2>Par chantier</h2><div class="lg">Touche un chantier pour le détailler.</div>${D.ch.map(c => { const x = agg(c.rows), y = aggF(fbmSups(c)); return `<div class="row fl" role="button" tabindex="0" data-pick="${esc(c.k)}"><div class="rl"><span>${esc(c.name)}</span><b><span style="color:var(--sx)">SUTX ${x.p} %</span> · <span style="color:var(--fb)">FBM ${y.p} %</span></b></div>${stk(x)}<div style="height:6px"></div>${dbar(y.dT, y.dA, y.tot)}</div>`; }).join('')}</div>`;
  const lgd = `<div class="lg2" style="justify-content:center;margin:10px 0 0"><span><i style="background:var(--sx)"></i>Terrain SUTX</span><span><i style="background:var(--fb)"></i>Terrain FBM</span><span><i style="background:var(--ad)"></i>Saisi par moi</span></div>`;
  const K = aggK(S.rc), fktCard = K.n ? `<div class="card"><h2>FKT définitives</h2><div class="rl"><span>${K.d} / ${K.n}</span><b>${K.p} %</b></div>${dbar(K.T, K.A, K.n, 'big', '--gc')}<div class="mu tl"><span style="color:var(--gc)">■</span> ${K.T} terrain · <span style="color:var(--ad)">■</span> ${K.A} saisie(s) par moi · ${K.P} provisoire(s) · ${K.none} sans FKT</div></div>` : '';

  if(sub === 'glob') return s + `<div class="kpis">${kpi('SUTX', a.p + ' %', `${a.T - a.Ta} terrain · ${a.Ta} par moi / ${a.w}`, '--sx')}${kpi('FBM', f.p + ' %', `${f.d} / ${f.tot} supports complets${f.pE ? ' · ' + f.pE + ' en cours' : ''}`, '--fb')}${kpi('En cours', a.E, 'tâches', '--ec')}${kpi('Non-conformités', a.nc + ncOf(S.fb) + ncOf(S.rc), 'à traiter', '--dep')}</div>
    <div class="card"><div class="rings">${ring(a.p,'--sx','Avancement SUTX',a.pA)}${ring(f.p,'--fb','Avancement FBM',f.pA)}</div>${lgd}</div>
    ${fktCard}
    ${S.c ? '' : parC}
    ${L ? `<div class="card"><h2>Supports terminés</h2><div class="rl"><span>${nok} / ${L.length}</span><b>${pc(nok, L.length)} %</b></div>${pbar(pc(nok, L.length),'--pose','big')}</div>` : ''}` + vAct(actOf(S.rows, S.ps));

  if(sub === 'sutx'){
    const types = TYPES.map(t => {
      const x = agg(S.rows.filter(r => key(r.type) === t));
      const actif = sutxType === t;
      return `<div class="row fl${actif ? ' on' : ''}" role="button" tabindex="0"
        data-sutx-type="${t}" aria-pressed="${actif}"
        style="cursor:pointer;border-radius:8px;padding:8px;${actif ? 'outline:2px solid var(' + TC[t] + ');background:var(--card)' : ''}">
        <div class="rl">
          <span style="color:var(${TC[t]});font-weight:600">${TL[t]}</span>
          <b>${x.T}/${x.w} · ${x.p} %${x.Ta ? ' · ' + x.Ta + ' par moi' : ''}${actif ? ' ✓' : ''}</b>
        </div>
        ${stk(x)}
      </div>`;
    }).join('');

    const chantiersSutx = D.ch.filter(c => {
      const rows = sutxType === 'all' ? c.rows : c.rows.filter(r => key(r.type) === sutxType);
      return rows.length > 0;
    }).map(c => {
      const rows = sutxType === 'all' ? c.rows : c.rows.filter(r => key(r.type) === sutxType);
      const x = agg(rows);
      return `<div class="row fl" role="button" tabindex="0" data-pick="${esc(c.k)}">
        <div class="rl"><span>${esc(c.name)}</span><b>${x.p} %</b></div>${stk(x)}
      </div>`;
    }).join('');

    return s + `<div class="card">
      <h2>Par type · Filtre supplémentaire</h2>
      ${types}
      ${sutxType !== 'all' ? `<div class="mu" style="text-align:center">Filtre actif : ${TL[sutxType]} · <span data-sutx-type="all" role="button" tabindex="0" style="text-decoration:underline;cursor:pointer">Tout afficher</span></div>` : ''}
    </div>` + (S.c ? sup : `<div class="card"><h2>Par chantier</h2>${legend()}${chantiersSutx || '<div class="mu">Aucun chantier pour ce type.</div>'}</div>`);
  }

  return s + `<div class="card"><h2>Étapes</h2>${rowF('Fouille', f.s.fouille)}${rowF('Béton', f.s.beton)}${rowF('Matage', f.s.matage)}${lgd}</div>
    <div class="card"><h2>Volume béton (m³)</h2><div class="rl"><span>Prévu réalisé / prévu total</span><b>${nf(f.mpr)} / ${nf(f.mp)} · ${pc(f.mpr, f.mp)} %</b></div>${pbar(pc(f.mpr, f.mp),'--fb','big')}<div class="rl" style="margin-top:10px"><span>Béton réel coulé</span><b>${nf(f.mr)}</b></div><div class="rl"><span>Écart réel − prévu (supports bétonnés)</span><b>${f.ec > 0.049 ? '+' : ''}${nf(Math.abs(f.ec) < 0.05 ? 0 : f.ec)}</b></div>${f.sr ? `<div class="mu tl">${f.sr} support(s) bétonné(s) sans volume réel saisi : exclus de l'écart.</div>` : ''}</div>`
    + (S.c ? fbmDetail(S.c) : `<div class="card"><h2>Par chantier</h2>${D.ch.filter(c => fbmSups(c).length).map(c => { const x = aggF(fbmSups(c)), q = k => x.s[k].T + x.s[k].A; return `<div class="row fl" role="button" tabindex="0" data-pick="${esc(c.k)}"><div class="rl"><span>${esc(c.name)}</span><b>${x.p} %</b></div>${dbar(x.dT, x.dA, x.tot)}<div class="mu tl">Fouille ${q('fouille')}/${x.s.fouille.n} · Béton ${q('beton')}/${x.s.beton.n} · Matage ${q('matage')}/${x.s.matage.n}</div></div>`; }).join('')}</div>`);
}

/* ---------- Onglet Chantiers ---------- */
function supList(c){
  return Object.values(c.s).map(p => {
    const a = agg(p.rows), st = stepsOf(p), fd = st.filter(k => stepState(p, k)).length;
    return {p, a, ok:(a.n + st.length) > 0 && a.T + a.A === a.n && fd === st.length};
  }).sort((x,y) => x.p.name.localeCompare(y.p.name, 'fr', {numeric:true}));
}
/* Liste des supports SUTX, filtrable par type */
function supListSutx(c, typeFilter = 'all'){
  return Object.values(c.s).map(p => {
    const rows = typeFilter === 'all'
      ? p.rows
      : p.rows.filter(r => key(r.type) === typeFilter);
    if(!rows.length) return null;
    const a = agg(rows);
    return {p, rows, a, ok:a.n > 0 && a.T + a.A === a.n};
  }).filter(Boolean).sort((x,y) => x.p.name.localeCompare(y.p.name, 'fr', {numeric:true}));
}

/* Ligne support SUTX sans indicateurs FBM */
function sRowSutx(x, ck){
  return `<div class="sp" role="button" tabindex="0" data-c="${esc(ck)}" data-s="${esc(x.p.k)}">
    <div class="rl"><b>${esc(x.p.name)}</b><span>${x.ok ? '✅' : ''}</span></div>
    ${stk(x.a)}
    <div class="mu tl">${TYPES.filter(t => x.rows.some(r => key(r.type) === t)).map(t => {
      const y = agg(x.rows.filter(r => key(r.type) === t));
      return `${TL[t]} ${y.T}/${y.n}`;
    }).join(' · ') || 'Pas de tâche SUTX'}</div>
  </div>`;
}
const sRow = (x, ck) => `<div class="sp" role="button" tabindex="0" data-c="${esc(ck)}" data-s="${esc(x.p.k)}"><div class="rl"><b>${esc(x.p.name)}</b><span class="chips">${(x.a.nc + ncOf(x.p.fb) + ncOf(x.p.rc)) ? '<span class="nb">⚠️ NC</span>' : ''}${stepsOf(x.p).length ? STEPK.map((k,i) => { const st = stepState(x.p, k); return `<em class="${st === 'T' ? 'on' : st === 'A' ? 'ad' : ''}">${'FBM'[i]}</em>`; }).join('') : ''}</span></div>
  ${x.a.n ? stk(x.a) : ''}
  <div class="mu tl">${TYPES.filter(t => x.p.rows.some(r => key(r.type) === t)).map(t => { const y = agg(x.p.rows.filter(r => key(r.type) === t)); return `<span style="${y.T === y.n ? 'color:var(--pose)' : ''}">${TL[t]} ${y.T}/${y.n}</span>`; }).join(' · ') || 'Pas de tâche SUTX'}</div></div>`;

/* Détail FBM d'un chantier : une ligne par support, avec l'état de chaque étape */
function fbmDetail(c){
  const L = fbmSups(c).map(p => { const st = stepsOf(p).map(k => stepState(p, k)); return {p, st, n:st.filter(Boolean).length, ok:st.length > 0 && st.every(Boolean)}; })
    .sort((a,b) => (a.ok - b.ok) || a.p.name.localeCompare(b.p.name, 'fr', {numeric:true}));
  const nok = L.filter(x => x.ok).length, lib = {fouille:'F', beton:'B', matage:'M'};
  return `<div class="card"><h2>Supports FBM · ${nok} / ${L.length} complets</h2><div class="lg">F fouille · B béton · M matage. Un support compte pour 1 quand toutes ses étapes sont faites.</div>
  ${L.map(x => `<div class="sp" role="button" tabindex="0" data-c="${esc(c.k)}" data-s="${esc(x.p.k)}"><div class="rl"><b>${esc(x.p.name)}</b><span class="chips">${stepsOf(x.p).map((k,i) => `<em class="${x.st[i] === 'T' ? 'on' : x.st[i] === 'A' ? 'ad' : ''}">${lib[k]}</em>`).join('')}${x.ok ? ' ✅' : ''}</span></div><div class="mu tl">${x.n} / ${x.st.length} étapes${betonTxt(x.p)}</div></div>`).join('') || '<div class="mu">Aucun support.</div>'}</div>`;
}
/* Béton d'un support : prévu / réel selon l'avancement (liste FBM) */
function betonTxt(p){
  if(!stepsOf(p).includes('beton')) return '';
  const b = p.b, pv = b ? num(b.m3_prevu) : null, rl = m3r(b), fait = stepState(p, 'beton') !== null, adm = !!b && num(b.m3_reel) === null && num(b.admin_m3_reel) !== null;
  if(pv === null) return ' · béton : prévu non renseigné';
  if(!fait) return ' · béton : prévu ' + nf(pv) + ' m³';
  if(rl === null) return ' · béton fait : réel non saisi (prévu ' + nf(pv) + ' m³)';
  const e = rl - pv;
  return ' · béton : ' + nf(rl) + ' / ' + nf(pv) + ' m³' + (Math.abs(e) >= 0.05 ? ' (' + (e > 0 ? '+' : '') + nf(e) + ')' : '') + (adm ? ' 📌' : '');
}
const STEPS = {fouille:['Fouille'], beton:['Béton'], matage:['Matage']};
function supMatch(p, f){
  if(!f) return true;
  const todo = f.m === 'todo';
  if(STEPS[f.k]){ if(!stepsOf(p).includes(f.k)) return false; return (stepState(p, f.k) !== null) !== todo; }
  const L = p.rows.filter(r => key(r.type) === f.k);
  if(!L.length) return false;
  const fin = L.every(r => { const e = eff(r); return e === 'T' || e === 'A'; });
  return fin !== todo;
}
const frow = (c, k, label, right, bar) => { const f = cf[c.k], on = !!f && f.k === k; return `<div class="row fl${on ? ' on' : ''}" role="button" tabindex="0" data-cf="${k}" data-cc="${esc(c.k)}"><div class="rl"><span>${label}${on ? ' <small>· ' + (f.m === 'todo' ? 'à faire' : 'faits') + '</small>' : ''}</span><b>${right}</b></div>${bar}</div>`; };

function fill(){
  const q = key($('#q').value);
  const list = D.ch.filter(c => key(c.name).includes(q) || Object.values(c.s).some(p => key(p.name).includes(q)));
  $('#list').innerHTML = list.length ? list.map(c => {
    const a = agg(c.rows), f = aggF(fbmSups(c)), L = supList(c), byS = !!q && !key(c.name).includes(q), nok = L.filter(x => x.ok).length;
    const fc = cf[c.k];
    let shown = L.filter(x => supMatch(x.p, fc));
    if($('#rest').checked) shown = shown.filter(x => !x.ok);
    if(byS) shown = shown.filter(x => key(x.p.name).includes(q));
    const fl = fc ? (STEPS[fc.k] ? STEPS[fc.k][0] : TL[fc.k]) + ' ' + (fc.m === 'todo' ? 'à faire' : 'faits') : '';
    const steps = [['fouille','Fouille'],['beton','Béton'],['matage','Matage']];
    return `<details class="card" data-k="${esc(c.k)}"${byS || OPEN.has(c.k) ? ' open' : ''}><summary>
      <div class="rl"><b>${esc(c.name)}</b><span class="mu" style="margin-right:18px">${(a.nc + ncOf(c.fb) + ncOf(c.rc)) ? '<span class="nb">⚠️ ' + (a.nc + ncOf(c.fb) + ncOf(c.rc)) + ' NC</span>' : ''}<span style="color:var(--sx)">SUTX ${a.p} %</span> · <span style="color:var(--fb)">FBM ${f.p} %</span></span></div>
      ${stk(a)}<div style="height:6px"></div>${dbar(f.dT, f.dA, f.tot)}</summary>
      <div class="in"><button type="button" data-go="${esc(c.k)}" style="width:100%;margin:10px 0;font-weight:600">📊 Synthèse de ce chantier</button>${legend()}<div class="lg">Touche une ligne pour ne lister que les supports « à faire », puis « faits », puis tout.</div>${TYPES.filter(t => c.rows.some(r => key(r.type) === t)).map(t => { const y = agg(c.rows.filter(r => key(r.type) === t)); return frow(c, t, `<span style="color:var(${TC[t]});font-weight:600">${TL[t]}</span>`, `${y.T}/${y.w} · ${y.p} %`, stk(y)); }).join('')}
      ${steps.filter(([k]) => f.s[k].n).map(([k,l]) => { const x = f.s[k]; return frow(c, k, l, `${x.T + x.A} / ${x.n} · ${pc(x.T + x.A, x.n)} %`, dbar(x.T, x.A, x.n)); }).join('')}
      <h2 style="margin-top:16px">Supports : ${nok} / ${L.length} terminés</h2>
      ${fc ? `<div class="lg"><b>Filtre : ${esc(fl)}</b> · ${shown.length} support(s)</div>` : ''}
      ${shown.map(x => sRow(x, c.k)).join('') || '<div class="mu">Aucun support à afficher.</div>'}</div></details>`;
  }).join('') : '<div class="card mu">Aucun chantier trouvé.</div>';
}

/* ---------- Onglet Qualité (NC / en cours / annulées) ---------- */
const dt = d => d ? new Date(d.length > 10 ? d : d + 'T00:00:00').toLocaleDateString('fr-FR') : '—';
const qrow = r => { const e = eff(r), who = [r.prenom, r.nom].filter(Boolean).join(' ');
  return `<div class="card qc" role="button" tabindex="0" data-c="${esc(key(r.Chantier))}" data-s="${esc(key(r.Support))}">
    <div class="rl"><b>${esc(r.Tache)}</b>${e === 'E' ? `<span class="pill" style="background:var(--ec)">${pctOf(r)} %</span>` : e === 'A' ? '<span class="pill" style="background:var(--mu)">Annulé</span>' : ''}</div>
    <div class="mu tl" style="margin:0 0 6px">${esc(r.Chantier)} › ${esc(r.Support)} · ${TL[key(r.type)]}</div>
    ${e === 'E' ? pbar(pctOf(r), '--ec') : ''}
    ${isFKT(r) ? fktChip(r) : ''}
    ${r.explication && e !== 'T' ? `<div class="tl">${esc(r.explication)}</div>` : ''}
    ${r.conforme === false ? (r.nc_levee === true ? `<div class="nc" style="background:rgba(47,143,99,.15);color:var(--pose)">✅ NC levée le ${dt(r.nc_levee_le)} — ${esc(r.nc_levee_expl)}</div>` : `<div class="nc">⚠️ ${esc(r.nc_description)}</div>`) : ''}
    ${r.pend_prov ? `<div class="nc" style="background:rgba(20,150,150,.14);color:var(--sx)">🔧 Provisoires : ${esc(r.pend_prov_depose || 0)} déposés / ${esc(r.pend_prov)} posés</div>` : ''}
    <div class="mu tl">${esc(who) || '—'} · ${dt(r.updated_at)}</div></div>`; };

function vQa(){
  const prov = r => (parseInt(r.pend_prov, 10) || 0) > (parseInt(r.pend_prov_depose, 10) || 0);

  const rows = L[qf].slice().sort((a,b) => String(b.updated_at).localeCompare(String(a.updated_at)));

/* ---------- Mode admin : déclarations + veille ---------- */
const jour = () => { const d = new Date(); if(d.getHours() < 6) d.setDate(d.getDate() - 1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const nz = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

async function verifAdmin(email){
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/app_bob?email=eq.${encodeURIComponent(email)}&select=nom,prenom,admin`, {headers:{apikey:SUPABASE_ANON_KEY}});
    if(!r.ok) return null;
    const a = await r.json();
    return a[0] && a[0].admin === true ? {email, nom:a[0].nom || '', prenom:a[0].prenom || ''} : null;
  }catch(e){ return null; }
}

function majAdminUI(){
  $('#adm').textContent = ADM ? '🔓 ' + (ADM.prenom || 'Admin') : '🔐 Admin';
  $('#nadm').style.display = ADM ? '' : 'none';
  if(!ADM && tab === 'adm') tab = 'syn';

async function connexionAdmin(){
  if(ADM){
    if(confirm('Quitter le mode admin ?')){ ADM = null; localStorage.removeItem('pcle_adm'); majAdminUI(); show(); }
    return;
  }
  const email = (prompt('Email administrateur :', localStorage.getItem('pcle_adm') || localStorage.getItem('emailSutx') || '') || '').trim().toLowerCase();
  if(!email) return;
  const a = await verifAdmin(email);
  if(!a){ alert("Accès refusé : cet email n'est pas administrateur."); return; }
  ADM = a; localStorage.setItem('pcle_adm', email); tab = 'adm'; majAdminUI(); show();
}

async function patchTable(table, id, patch){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {method:'PATCH', headers:{apikey:SUPABASE_ANON_KEY, 'Content-Type':'application/json', Prefer:'return=representation'}, body:JSON.stringify(patch)});
  if(!r.ok) throw new Error(table + ' : erreur ' + r.status);
  const a = await r.json().catch(() => []);
  if(!Array.isArray(a) || !a.length) throw new Error(table + ' : aucune ligne modifiée (droit UPDATE / RLS à vérifier)');
}

/* Pour Fouille/Béton/Matage : recopie l'état dans la date FBM (si le terrain n'a pas déjà saisi la sienne) */
async function syncFbm(r, on, par){
  if(!isFBM(r)) return;
  const c = D.ch.find(x => x.k === key(r.Chantier)), p = c && c.s[key(r.Support)], b = p && p.b;
  const t = nz(r.Tache), col = t.includes('fouille') ? 'fouille' : t.includes('beton') ? 'beton' : 'matage';
  if(b && !b['date_' + col]){
    const bp = {['admin_date_' + col]: on ? jour() : null, admin_par: par, admin_maj_le: new Date().toISOString()};
    await patchTable('blindage', b.id, bp); Object.assign(b, bp);
  }
}

const SQL_SOUS = "Colonne admin_sous absente. Dans Supabase > SQL Editor, exécute :\n\nalter table suivi_sutx_v2 add column if not exists admin_sous text;\nnotify pgrst, 'reload schema';\n\nPuis actualise l'app.";

/* Enregistre les sous-tâches saisies par l'admin et en déduit l'état de la tâche */
async function adminSave(r, sous){
  const par = (ADM.prenom + ' ' + ADM.nom).trim(), e = Object.keys(sous).length ? sousEtat(r, sous) : {etat:null, pct:null};
  const patch = {admin_sous:Object.keys(sous).length ? JSON.stringify(sous) : null, admin_etat:e.etat, admin_pct:e.pct, admin_le:e.etat ? jour() : null, admin_par:e.etat ? par : null};
  try{ await patchTable('suivi_sutx_v2', r.id, patch); Object.assign(r, patch); await syncFbm(r, e.etat === 'TERMINE', par); }
  catch(ex){ alert('Mise à jour impossible : ' + ex.message); }
  rafraichirApres();
}

async function adminSous(tid, mid){
  const r = D.qa.find(x => String(x.id) === String(tid));
  if(!r || !ADM) return;
  if(!D.hasSous){ alert(SQL_SOUS); return; }
  const m = modsOf(r).find(x => String(x.id) === String(mid));
  if(!m) return;
  const cur = sousState(r, m);
  if(cur === 'T' || cur === 'N') return;
  const sous = adminSousOf(r);
  if(cur === null) sous[m.id] = 'FAIT'; else if(cur === 'A') sous[m.id] = 'NON_CONCERNE'; else delete sous[m.id];
  await adminSave(r, sous);
}

/* Coche « Terminé » : sur une tâche à sous-tâches, coche / décoche toutes celles qui ne viennent pas du terrain */
async function adminTache(id, val){
  const r = D.qa.find(x => String(x.id) === String(id));
  if(!r || !ADM) return;
  if(modsOf(r).length){
    if(!D.hasSous){ alert(SQL_SOUS); rafraichirApres(); return; }
    const sous = {};
    if(val !== 'CLEAR') modsOf(r).forEach(m => { const st = sousState(r, m); if(st === null || st === 'A') sous[m.id] = 'FAIT'; else if(st === 'AN') sous[m.id] = 'NON_CONCERNE'; });
    return adminSave(r, sous);
  }
  const par = (ADM.prenom + ' ' + ADM.nom).trim();
  const patch = val === 'CLEAR'
    ? {admin_etat:null, admin_pct:null, admin_le:null, admin_par:null}
    : {admin_etat:'TERMINE', admin_pct:null, admin_le:jour(), admin_par:par};
  try{ await patchTable('suivi_sutx_v2', id, patch); Object.assign(r, patch); await syncFbm(r, val !== 'CLEAR', par); }
  catch(e){ alert('Mise à jour impossible : ' + e.message); }
  rafraichirApres();
}

/* ===== Récap admin : chantier → FBM / SUTX → supports, à date ou sur une période ===== */
const AS = {ch:null, dom:'FBM', mode:'date', date:'', from:'', to:'', q:''};
const addD = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const dEnd = r => r.Fait ? String(r.date_fait || r.updated_at || '').slice(0,10) : r.admin_etat === 'TERMINE' ? String(r.admin_le || r.updated_at || '').slice(0,10) : null;
const stepDay = (p, k) => {
  const c = [];
  if(p.b){ if(p.b['date_' + k]) c.push(String(p.b['date_' + k]).slice(0,10)); if(p.b['admin_date_' + k]) c.push(String(p.b['admin_date_' + k]).slice(0,10)); }
  p.fb.filter(r => nz(r.Tache).includes(k)).forEach(r => { const d = dEnd(r); if(d !== null) c.push(d); });
  return c.length ? c.sort()[0] : null;
};
const inP = (d, a, b) => !!d && d >= a && d <= b;
const byName = (x, y) => x.name.localeCompare(y.name, 'fr', {numeric:true});
const sutxAt = (rows, t) => { const w = rows.filter(r => eff(r) !== 'A'), x = w.filter(r => { const d = dEnd(r); return d !== null && d <= t; }).length; return {n:w.length, t:x, p:pc(x, w.length)}; };
const stepsAt = (p, t) => STEPK.map(k => !stepsOf(p).includes(k) ? null : (d => d !== null && d <= t)(stepDay(p, k)));
const fbmAt = (ps, t) => { const x = ps.filter(p => { const s = stepsAt(p, t); return s.every(v => v !== false) && s.some(v => v === true); }).length; return {n:ps.length, t:x, p:pc(x, ps.length)}; };
const fbPer = p => stepsOf(p).filter(k => inP(stepDay(p, k), AS.from, AS.to));
const sxPer = rows => rows.filter(r => inP(dEnd(r), AS.from, AS.to));

function vAdm(){
  if(!AS.date){ AS.date = AS.to = jour(); AS.from = addD(jour(), -6); }
  const per = AS.mode === 'per', A = per ? AS.to : AS.date, c = AS.ch && D.ch.find(x => x.k === AS.ch);
  if(AS.ch && !c) AS.ch = null;
  const b = (a, t, on) => `<button type="button" data-an="${a}" aria-pressed="${!!on}">${t}</button>`;
  const rows = c ? c.rows : D.all, ps = c ? fbmSups(c) : D.ch.flatMap(fbmSups);
  const sx = sutxAt(rows, A), fb = fbmAt(ps, A), B = addD(AS.from, -1);
  const sx0 = per ? sutxAt(rows, B) : null, fb0 = per ? fbmAt(ps, B) : null;
  const nS = sxPer(rows).length, nF = ps.reduce((t, p) => t + fbPer(p).length, 0);
  let h = '';
  if(c) h += `<button type="button" data-an="ch|" style="width:100%;font-weight:600;margin:4px 0">← Tous les chantiers · ${esc(c.name)}</button><div class="seg">${b('dom|FBM', 'FBM', AS.dom === 'FBM')}${b('dom|SUTX', 'SUTX', AS.dom === 'SUTX')}</div>`;
  h += `<div class="seg">${b('mode|date', 'À date', !per)}${b('mode|per', 'Période', per)}</div>`;
  h += per
    ? `<div class="admsearch"><div style="display:flex;gap:8px"><label class="mu tl" style="flex:1">Du<input type="date" id="a-from" value="${AS.from}"></label><label class="mu tl" style="flex:1">Au<input type="date" id="a-to" value="${AS.to}"></label></div><div style="display:flex;gap:8px">${b('we|', 'Week-end', 0)}${b('sem|', '7 jours', 0)}</div></div>`
    : `<div class="admsearch"><div style="display:flex;gap:8px"><input type="date" id="a-date" value="${AS.date}">${b('today|', "Aujourd'hui", 0)}</div><div class="mu tl">Avancement des tâches terminées à cette date.</div></div>`;
  h += `<div class="kpis">${kpi('SUTX', sx.p + ' %', `${sx.t} / ${sx.n} tâches${per ? ` · +${nS} sur la période (${sx0.p} → ${sx.p} %)` : ''}`, '--sx')}${kpi('FBM', fb.p + ' %', `${fb.t} / ${fb.n} supports complets${per ? ` · +${nF} étapes sur la période (${fb0.p} → ${fb.p} %)` : ''}`, '--fb')}</div>`;
  h += `<button type="button" data-an="pdf|" style="width:100%;font-weight:600;margin-bottom:12px">📄 Exporter en PDF</button>`;
  if(!c){
    h += `<div class="admsearch"><input id="a-q" type="search" value="${esc(AS.q)}" placeholder="Rechercher un support, un BL, une FKT…"></div>`;
    const q = nz(AS.q.trim());
    if(q){
      const L = D.ch.flatMap(x => Object.values(x.s).map(p => ({x, p}))).filter(({x, p}) => nz([x.name, p.name, p.b && p.b.bl_beton, p.rc.map(r => fktOf(r).num).join(' ')].join(' ')).includes(q));
      h += L.slice(0, 60).map(({x, p}) => `<div class="card qc" role="button" tabindex="0" data-c="${esc(x.k)}" data-s="${esc(p.k)}"><div class="rl"><b>${esc(p.name)}</b><span class="mu">${esc(x.name)}</span></div>${p.b && p.b.bl_beton ? `<div class="meta">BL ${esc(p.b.bl_beton)}</div>` : ''}</div>`).join('') || '<div class="card mu">Aucun résultat.</div>';
    } else h += D.ch.map(x => {
      const a = sutxAt(x.rows, A), f = fbmAt(fbmSups(x), A);
      return `<div class="card qc" role="button" tabindex="0" data-an="ch|${esc(x.k)}"><div class="rl"><b>${esc(x.name)}</b><span><span style="color:var(--sx)">SUTX ${a.p} %</span> · <span style="color:var(--fb)">FBM ${f.p} %</span></span></div>${pbar(a.p, '--sx')}<div style="height:6px"></div>${pbar(f.p, '--fb')}${per ? `<div class="mu tl">+${sxPer(x.rows).length} tâche(s) · +${fbmSups(x).reduce((t, p) => t + fbPer(p).length, 0)} étape(s) FBM sur la période</div>` : ''}</div>`;
    }).join('');
  } else if(AS.dom === 'FBM'){
    const L = fbmSups(c).filter(p => !per || fbPer(p).length).sort(byName);
    h += `<div class="card"><h2>Supports FBM · ${L.length}</h2>` + (L.map(p => { const s = stepsAt(p, A); return `<div class="sp" role="button" tabindex="0" data-c="${esc(c.k)}" data-s="${esc(p.k)}"><div class="rl"><b>${esc(p.name)}</b><span class="chips">${s.map((v, i) => v === null ? '' : `<em class="${v ? 'on' : ''}">${'FBM'[i]}</em>`).join('')}${s.every(v => v !== false) && s.some(v => v === true) ? ' ✅' : ''}</span></div>${per ? `<div class="mu tl">${fbPer(p).map(k => ({fouille:'Fouille', beton:'Béton', matage:'Matage'}[k])).join(', ')}</div>` : ''}</div>`; }).join('') || '<div class="mu">Aucun support.</div>') + '</div>';
  } else {
    const L = Object.values(c.s).filter(p => p.rows.length && (!per || sxPer(p.rows).length)).sort(byName);
    h += `<div class="card"><h2>Supports SUTX · ${L.length}</h2>` + (L.map(p => { const x = sutxAt(p.rows, A); return `<div class="sp" role="button" tabindex="0" data-c="${esc(c.k)}" data-s="${esc(p.k)}"><div class="rl"><b>${esc(p.name)}</b><span>${x.t} / ${x.n}</span></div>${pbar(x.p, '--sx')}${per ? `<div class="mu tl">${sxPer(p.rows).map(r => esc(r.Tache)).join(' · ')}</div>` : ''}</div>`; }).join('') || '<div class="mu">Aucun support.</div>') + '</div>';
  }
  return h;
}

function adminPdf(){
  const per = AS.mode === 'per', A = per ? AS.to : AS.date, c = AS.ch && D.ch.find(x => x.k === AS.ch);
  const d = pdfDoc(), W = d.W, H = d.H, L = 32, R = W - 32, BOT = H - 46, K = {tx:'#1a232c', mu:'#6b7884', ln:'#d9dee2', navy:'#0b2545', j:'#f2c200', sx:'#2f6f9f', fb:'#8a5fb0'};
  
  // Heure actuelle d'édition incluse dans tous les cas
  const nowTime = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  const quand = per ? `Période du ${dt(AS.from)} au ${dt(AS.to)} — Édité à ${nowTime}` : `Situation à la date du ${dt(AS.date)} à ${nowTime}`;
  
  const nom = c ? c.name : 'Tous les chantiers';
  let y = 0;

  const page = () => { d.page(); y = 40; };
  const sectionTitle = (t) => {
    if(y + 30 > BOT) page();
    y += 10;
    d.text(L, y + 10, t, 11, true, K.navy);
    d.rect(L, y + 15, R - L, 1.2, K.navy);
    y += 24;
  };

  page();
  // En-tête du document avec l'heure intégrée
  d.rect(L, 36, R - L, 55, K.navy); d.rect(L, 91, R - L, 3.5, K.j);
  d.text(L + 16, 58, "RAPPORT D'AVANCEMENT — PCLE-MMM", 15, true, '#ffffff');
  d.text(L + 16, 74, nom + '  |  ' + quand, 9, false, '#c9d3df');
  y = 108;

  // Filtrer les chantiers selon la sélection globale ou un chantier unique
  const targetChantiers = c ? [c] : D.ch;

  // --- SECTION 1 : TRAVAUX SUTX ---
  sectionTitle(per ? "1. ACTIVITÉ SUTX SUR LA PÉRIODE" : "1. ACTIVITÉ SUTX (CUMULÉE À DATE)");
  
  const activeSutxCh = targetChantiers.map(ch => {
    const items = per ? sxPer(ch.rows) : ch.rows.filter(r => dEnd(r) && dEnd(r) <= A);
    return { ch, items };
  }).filter(item => item.items.length > 0);

  if(!activeSutxCh.length){
    d.text(L, y + 10, "Aucune tâche SUTX enregistrée pour cette échéance.", 9, false, K.mu);
    y += 20;
  } else {
    activeSutxCh.forEach(({ ch, items }) => {
      if(y + 25 > BOT) page();
      
      const sxStat = sutxAt(ch.rows, A);
      const periodLabel = per ? `réalisé sur la période : ${items.length} tâche(s)` : `réalisé à date : ${items.length} tâche(s)`;

        d.text(L + 10, y + 10, pdfFit(`- Support ${p.name} : ${stepLabels}`, 340, 8.5, false), 8.5, false, K.tx);
        
        if(steps.includes('beton') && p.b){

        y += 14;
      });
      y += 6;

  const n = d.count();
  for(let i = 0; i < n; i++){

function modsOf(r){
  const nom = t => key(String(t || '').replace(/\s+AXE\s*\d+$/i, ''));
  return (D.mod || []).filter(m => m.actif !== false && nom(m.tache) === nom(r.Tache)).sort((a,b) => (a.ordre || 0) - (b.ordre || 0) || a.id - b.id);
}

/* T/N = relevé terrain (fait / non concerné) · A/AN = saisi par moi · null = pas fait */
function sousState(r, m){
  const st = (D.sidx.get(String(r.id)) || new Map()).get(String(m.id));
  if(st === 'FAIT') return 'T';
  if(st === 'NON_CONCERNE') return 'N';
  const a = adminSousOf(r)[m.id];
  return a === 'FAIT' ? 'A' : a === 'NON_CONCERNE' ? 'AN' : null;
}
/* état de la tâche calculé à partir des sous-tâches (terrain + saisies admin) */
function sousEtat(r, sous){
  let w = 0, d = 0;
  modsOf(r).forEach(m => {
    const f = (D.sidx.get(String(r.id)) || new Map()).get(String(m.id));
    const st = (f === 'FAIT' || f === 'NON_CONCERNE') ? f : sous[m.id];
    if(st === 'NON_CONCERNE') return;
    const q = +m.poids || 1; w += q; if(st === 'FAIT') d += q;
  });
  if(w && d >= w) return {etat:'TERMINE', pct:null};
  if(d > 0) return {etat:'EN_COURS', pct:Math.round(d / w * 100)};
  return {etat:null, pct:null};
}

const PW_N = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const PW_B = [278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
const PW_S = {'·':278,'›':333,'‹':333,'—':1000,'–':556,'…':1000,'’':250,'‘':250,'°':400,'«':556,'»':556,'œ':944,'€':556};
const PW_X = {'’':0x92,'‘':0x91,'“':0x93,'”':0x94,'—':0x97,'–':0x96,'…':0x85,'›':0x9B,'‹':0x8B,'€':0x80,'œ':0x9C,'Œ':0x8C};
function pdfW(s, size, bold){
  const T = bold ? PW_B : PW_N; let w = 0;
  for(const ch of String(s ?? '')){
    const c = ch.charCodeAt(0);
    if(c >= 32 && c < 127){ w += T[c - 32]; continue; }
    if(ch === '²' || ch === '³'){ w += T[19] * 0.62; continue; }
    const b = ch.normalize('NFD').charCodeAt(0);
    w += (b >= 32 && b < 127) ? T[b - 32] : (PW_S[ch] || 556);
  }
  return w * size / 1000;
}
function pdfHex(s){
  let o = '';
  for(const ch of String(s ?? '')){ const c = ch.charCodeAt(0), b = PW_X[ch] ?? (c >= 32 && c < 256 ? c : 63); o += b.toString(16).padStart(2, '0'); }
  return '<' + o + '>';
}
function pdfWrap(s, maxW, size, bold){
  const out = []; let line = '';
  String(s ?? '').split(/\s+/).filter(Boolean).forEach(w => {
    const t = line ? line + ' ' + w : w;
    if(!line || pdfW(t, size, bold) <= maxW) line = t; else { out.push(line); line = w; }
  });
  if(line) out.push(line);
  return out.flatMap(l => {
    if(pdfW(l, size, bold) <= maxW) return [l];
    const r = []; let cur = '';
    for(const ch of l){ if(pdfW(cur + ch, size, bold) > maxW){ r.push(cur); cur = ch; } else cur += ch; }
    if(cur) r.push(cur);
    return r;
  });
}
const pdfFit = (s, maxW, size, bold) => { s = String(s ?? ''); if(pdfW(s, size, bold) <= maxW) return s; while(s.length > 1 && pdfW(s + '…', size, bold) > maxW) s = s.slice(0, -1); return s + '…'; };

function pdfDoc(){
  const W = 595.28, H = 841.89, P = []; let k = -1;
  const col = h => [1, 3, 5].map(i => (parseInt(h.slice(i, i + 2), 16) / 255).toFixed(3)).join(' ');
  const o = s => P[k].push(s);
  return {
    W, H,
    page(){ P.push([]); k = P.length - 1; },
    go(i){ k = i; },
    count: () => P.length,
    rect(x, y, w, h, fill, stroke, lw){
      if(w <= 0 || h <= 0) return;
      o((fill ? col(fill) + ' rg ' : '') + (stroke ? col(stroke) + ' RG ' + (lw || 0.7) + ' w ' : '') + x.toFixed(2) + ' ' + (H - y - h).toFixed(2) + ' ' + w.toFixed(2) + ' ' + h.toFixed(2) + ' re ' + (fill && stroke ? 'B' : fill ? 'f' : 'S'));
    },
    text(x, y, s, size, bold, color, align){
      const parts = String(s ?? '').split(/([²³])/).filter(Boolean), sup = p => p === '²' || p === '³';
      const wp = p => pdfW(p, size, bold);
      const tot = parts.reduce((t, p) => t + wp(p), 0);
      if(align === 'r') x -= tot; else if(align === 'c') x -= tot / 2;
      const emit = (px, py, str, sz) => o('BT /' + (bold ? 'F2' : 'F1') + ' ' + sz + ' Tf ' + col(color || '#1a232c') + ' rg ' + px.toFixed(2) + ' ' + (H - py).toFixed(2) + ' Td ' + pdfHex(str) + ' Tj ET');
      parts.forEach(p => { if(sup(p)) emit(x, y - size * 0.38, p === '³' ? '3' : '2', size * 0.62); else emit(x, y, p, size); x += wp(p); });
    },
    build(){
      const obj = [];
      obj[1] = '<< /Type /Catalog /Pages 2 0 R >>';
      obj[2] = '<< /Type /Pages /Count ' + P.length + ' /Kids [' + P.map((_, i) => (5 + 2 * i) + ' 0 R').join(' ') + '] >>';
      obj[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      obj[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      P.forEach((c, i) => {
        const s = c.join('\n');
        obj[5 + 2 * i] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + W + ' ' + H + '] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + (6 + 2 * i) + ' 0 R >>';
        obj[6 + 2 * i] = '<< /Length ' + s.length + ' >>\nstream\n' + s + '\nendstream';
      });
      let out = '%PDF-1.4\n'; const off = [];
      for(let i = 1; i < obj.length; i++){ off[i] = out.length; out += i + ' 0 obj\n' + obj[i] + '\nendobj\n'; }
      const x = out.length;
      out += 'xref\n0 ' + obj.length + '\n0000000000 65535 f \n' + off.slice(1).map(v => String(v).padStart(10, '0') + ' 00000 n \n').join('');
      out += 'trailer\n<< /Size ' + obj.length + ' /Root 1 0 R >>\nstartxref\n' + x + '\n%%EOF';
      const u = new Uint8Array(out.length);
      for(let i = 0; i < out.length; i++) u[i] = out.charCodeAt(i) & 255;
      return u;
    }
  };
}

function rapportPdf(){

  const d = pdfDoc(), W = d.W, H = d.H, L = 32, R = W - 32, CW = R - L, BOT = H - 46;

  const stkBar = (x, yy, w, h, s) => bar(x, yy, w, h, [[s.T, C.pose], [s.E, C.ec], [s.A, C.mu]], s.n);

    /* Détail béton par support : données déjà présentes dans la fiche blindage */
    const betonRows = S.ps

  if(!D) return;
  let r;

  const blob = new Blob([r.bytes], {type:'application/pdf'}), file = new File([blob], r.name, {type:'application/pdf'});
  const peutPartager = !!(navigator.canShare && navigator.canShare({files:[file]}));

    <button type="button" id="pdf-save" style="width:100%;margin-top:14px;min-height:48px;font-weight:600">⬇️ Enregistrer sur le téléphone</button>

    <div class="mu tl" id="pdf-msg"></div></div>`;
  if(!dlg.open) dlg.showModal();
  $('#dx').onclick = () => dlg.close();
  $('#pdf-save').onclick = () => { const a = document.createElement('a'), u = URL.createObjectURL(blob); a.href = u; a.download = r.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000); $('#pdf-msg').textContent = 'Enregistré dans le dossier Téléchargements.'; };
  if(peutPartager) $('#pdf-share').onclick = () => navigator.share({files:[file], title:r.name}).catch(e => { if(e.name !== 'AbortError') $('#pdf-msg').textContent = 'Partage impossible : ' + e.message; });
});
